name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
        include:
          # The artifact layer promises byte-stable canonical JSON and SHA-256 input
          # hashes, so the suite also runs on Windows against the Python version that
          # produced the shipped Phase-0 calibration evidence.
          - os: windows-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # The comparator extra pulls in causal-learn so the section 13.4 baseline adapters
      # are exercised rather than skipped. It is not a runtime dependency; see pyproject.
      - run: pip install -e ".[comparators]"
      - run: pytest -q
