name: Explore p-extension

on:
  workflow_dispatch:
    inputs:
      replications:
        description: Replications per cell. Stage 0 uses 10; it measures scaling and establishes no performance criterion.
        default: '10'
      stage:
        description: Only stage 0 is approved. Stages 1 and 2 require review of stage 0 first.
        default: '0'
        type: choice
        options: ['0']

permissions:
  contents: read

jobs:
  cell:
    runs-on: ubuntu-latest
    # Two variable counts, not one. The cost of 30 variables alone is a number; 15 and 30
    # together give a slope, which is the only thing that can say whether the quadratic
    # growth assumed behind stages 1 and 2 actually holds. Two sample sizes do the same for
    # the row dimension.
    #
    # Moderately dense and mixed-curved throughout: the more expensive density and the arm
    # carrying the third estimator, so the measured cost is an upper bound rather than a
    # best case.
    strategy:
      fail-fast: false
      matrix:
        variables: [15, 30]
        sample_size: [100, 500]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install .
      - name: Report runner capacity
        run: 'nproc && free -g | head -2'
      - run: >
          python simulations/explore_p_extension.py shard
          --variables ${{ matrix.variables }}
          --sample-size ${{ matrix.sample_size }}
          --density moderate
          --arm mixed
          --replications ${{ inputs.replications }}
          --output out/p${{ matrix.variables }}-n${{ matrix.sample_size }}.parquet
      - uses: actions/upload-artifact@v4
        with:
          name: p-extension-stage0-p${{ matrix.variables }}-n${{ matrix.sample_size }}
          path: out/*.parquet
          retention-days: 90

  summarize:
    needs: cell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install .
      - uses: actions/download-artifact@v5
        with:
          pattern: p-extension-stage0-*
          path: downloaded
      - run: mkdir shards
      - run: find downloaded -name '*.parquet' -exec cp {} shards/ \;
      - run: python simulations/explore_p_extension.py summarize --shards shards --output p-extension-stage0
      - uses: actions/upload-artifact@v4
        with:
          name: p-extension-stage0-evidence
          path: p-extension-stage0
          retention-days: 90
