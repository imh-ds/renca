name: Explore p-extension

on:
  workflow_dispatch:
    inputs:
      replications:
        description: Replications per cell. Stage 0 uses 10 and measures scaling only; stage 1 uses the protocol's 500.
        default: '500'
      stage:
        description: Stage 0 measures scaling; stage 1 scores the seven criteria. Stage 2 requires review of stage 1 first.
        default: '1'
        type: choice
        options: ['0', '1']

permissions:
  contents: read

jobs:
  cell:
    runs-on: ubuntu-latest
    # Stage 1: two variable counts x four sample sizes x two densities x two shape arms,
    # which is 32 jobs against a 20-concurrent cap and so queues in two waves.
    #
    # The fully linear arm is the control. It carries no curved relationships, so criteria
    # 5 to 7 cannot be scored there and it is gated on 1 to 4 alone; what it contributes is
    # the cost of explore's flexibility where the incumbent's assumptions actually hold.
    #
    # Stage 0 measured 15 seconds per replication at 15 variables, so the longest cell here
    # is roughly two hours -- inside the six-hour job limit, and no sharding is needed. That
    # only becomes necessary at stage 2's 30-variable cells.
    strategy:
      fail-fast: false
      matrix:
        variables: [12, 15]
        sample_size: [75, 100, 150, 250]
        density: [sparse, moderate]
        arm: [linear, mixed]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install .
      - name: Report runner capacity
        run: 'nproc && free -g | head -2'
      - run: >
          python simulations/explore_p_extension.py shard
          --variables ${{ matrix.variables }}
          --sample-size ${{ matrix.sample_size }}
          --density ${{ matrix.density }}
          --arm ${{ matrix.arm }}
          --replications ${{ inputs.replications }}
          --output out/${{ matrix.arm }}-${{ matrix.density }}-p${{ matrix.variables }}-n${{ matrix.sample_size }}.parquet
      - uses: actions/upload-artifact@v4
        with:
          name: p-extension-${{ matrix.arm }}-${{ matrix.density }}-p${{ matrix.variables }}-n${{ matrix.sample_size }}
          path: out/*.parquet
          retention-days: 90

  summarize:
    needs: cell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install .
      - uses: actions/download-artifact@v5
        with:
          pattern: p-extension-*
          path: downloaded
      - run: mkdir shards
      - run: find downloaded -name '*.parquet' -exec cp {} shards/ \;
      - run: python simulations/explore_p_extension.py summarize --shards shards --output p-extension-stage${{ inputs.stage }} --stage ${{ inputs.stage }}
      - uses: actions/upload-artifact@v4
        with:
          name: p-extension-stage${{ inputs.stage }}-evidence
          path: p-extension-stage${{ inputs.stage }}
          retention-days: 90
