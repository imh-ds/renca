name: Resolution coverage

on:
  workflow_dispatch:
    inputs:
      replications:
        description: Replications per family per cell; the demanded multiplier is the 4% lower quantile
        default: '600'
      learner_library_version:
        description: Library under test; v4 had the smallest bias at 100 rows in the small-sample gate
        default: 'v4_cubic_blend'

permissions:
  contents: read

jobs:
  cell:
    runs-on: ubuntu-latest
    # Four true Theta values x three sample sizes x five frozen families, which is 60 jobs
    # against a 20-concurrent cap. The Theta axis is the point of the study: Phase 0 reads its
    # multiplier at Theta = delta only, and `achieved_resolution` is read at whatever Theta a
    # pair happens to have, so the sweep is what says whether one multiplier can serve both.
    #
    # n = 300 is deliberately absent. A profile already exists there, so the fallback never
    # fires; the open question is only below it.
    strategy:
      fail-fast: false
      matrix:
        theta: ['0.05', '0.10', '0.20', '0.35']
        sample_size: [100, 150, 200]
        family:
          - continuous_linear_boundary_v1
          - bounded_composite_unsaturated_v1
          - bounded_composite_saturated_v1
          - nonlinear_continuous_v1
          - learner_misspecification_v1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install .
      - name: Report runner capacity
        run: 'nproc && free -g | head -2'
      - run: >
          python simulations/resolution_coverage.py shard
          --family ${{ matrix.family }}
          --sample-size ${{ matrix.sample_size }}
          --theta ${{ matrix.theta }}
          --replications ${{ inputs.replications }}
          --learner-library-version ${{ inputs.learner_library_version }}
          --output out/${{ matrix.family }}-n${{ matrix.sample_size }}-t${{ matrix.theta }}.parquet
      - uses: actions/upload-artifact@v4
        with:
          name: resolution-coverage-${{ matrix.family }}-n${{ matrix.sample_size }}-t${{ matrix.theta }}
          path: out/*.parquet
          retention-days: 90

  summarize:
    needs: cell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install . matplotlib
      - uses: actions/download-artifact@v5
        with:
          pattern: resolution-coverage-*
          path: downloaded
      - run: mkdir shards
      - run: find downloaded -name '*.parquet' -exec cp {} shards/ \;
      - run: python simulations/resolution_coverage.py summarize --shards shards --output resolution-coverage
      - uses: actions/upload-artifact@v4
        with:
          name: resolution-coverage-evidence
          path: resolution-coverage
          retention-days: 90
