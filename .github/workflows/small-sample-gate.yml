name: Small-sample gate

on:
  workflow_dispatch:
    inputs:
      replications:
        description: Replications per family per sample size; the critical quantile is the 4% lower one
        default: '600'
      delta:
        description: Resolution to test for reachability
        default: '0.20'
      learner_library_version:
        description: Learner library under study
        default: v4_cubic_blend
        type: choice
        options: [v3_nested_blend, v4_cubic_blend]

permissions:
  contents: read

jobs:
  cell:
    runs-on: ubuntu-latest
    # Five frozen families x four sample sizes is 20 jobs, exactly the concurrent cap on a
    # free public repository. n=300 is the control rung: a shipped profile already exists
    # there, so the miniature's estimate at 300 says how far to trust the other three.
    strategy:
      fail-fast: false
      matrix:
        family:
          - continuous_linear_boundary_v1
          - bounded_composite_unsaturated_v1
          - bounded_composite_saturated_v1
          - nonlinear_continuous_v1
          - learner_misspecification_v1
        sample_size: [100, 150, 200, 300]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install .
      - name: Report runner capacity
        run: 'nproc && free -g | head -2'
      - run: >
          python simulations/small_sample_gate.py shard
          --family ${{ matrix.family }}
          --sample-size ${{ matrix.sample_size }}
          --replications ${{ inputs.replications }}
          --delta ${{ inputs.delta }}
          --learner-library-version ${{ inputs.learner_library_version }}
          --output out/${{ matrix.family }}-n${{ matrix.sample_size }}.parquet
      - uses: actions/upload-artifact@v4
        with:
          name: small-sample-${{ matrix.family }}-n${{ matrix.sample_size }}
          path: out/*.parquet
          retention-days: 90

  summarize:
    needs: cell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install .
      - uses: actions/download-artifact@v5
        with:
          pattern: small-sample-*
          path: downloaded
      - run: mkdir shards
      - run: find downloaded -name '*.parquet' -exec cp {} shards/ \;
      - run: python simulations/small_sample_gate.py summarize --shards shards --output small-sample-gate
      - uses: actions/upload-artifact@v4
        with:
          name: small-sample-gate-evidence
          path: small-sample-gate
          retention-days: 90
