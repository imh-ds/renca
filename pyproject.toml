[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "renca"
version = "0.0.1"
description = "Resolution-aware causal compatibility network contracts"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "numpy>=1.26,<3",
    "pydantic>=2.7,<3",
    "PyYAML>=6,<7",
    "pandas>=2.1,<4",
    "pyarrow>=14,<24",
    "scikit-learn>=1.4,<2",
    "scipy>=1.11,<2",
    "statsmodels>=0.14,<1",
    "typer>=0.12,<1",
]

[project.scripts]
renca = "renca.cli:app"

[project.optional-dependencies]
test = [
    "jsonschema>=4.22,<5",
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
