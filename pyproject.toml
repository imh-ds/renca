[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "renca"
version = "0.0.1"
description = "Resolution-aware causal compatibility network contracts"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = [
    "jsonschema>=4.22,<5",
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
