[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "renca"
version = "0.0.1"
description = "Resolution-aware causal compatibility network contracts"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "numpy>=1.26,<3",
    "pydantic>=2.7,<3",
    "PyYAML>=6,<7",
    "pandas>=2.1,<4",
    "pyarrow>=14,<24",
    "scikit-learn>=1.4,<2",
    "scipy>=1.11,<2",
    "statsmodels>=0.14,<1",
    "threadpoolctl>=3,<4",
    "typer>=0.12,<1",
]

[project.scripts]
renca = "renca.cli:app"

[project.optional-dependencies]
test = [
    "jsonschema>=4.22,<5",
    "pytest>=8,<10",
]
# Structural baselines for the section 13.4 comparative gate. Kept out of the runtime
# dependencies deliberately: the package must not require a causal-discovery stack to
# certify a nonedge, and `renca.benchmark.comparators` imports these lazily so the rest of
# the package still imports without them.
comparators = [
    "renca[test]",
    "causal-learn>=0.1.3,<1",
]

[tool.setuptools.package-data]
renca = ["data/**/*.yml", "data/**/*.parquet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
